<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Ziheng Xu">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5A65B"/>
      <stop offset="0.52" stop-color="#E27D9B"/>
      <stop offset="1" stop-color="#A97FD1"/>
    </linearGradient>
    <style>
      .name, .sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-anchor: middle;
      }
      .name {
        font-size: 76px; font-weight: 700; fill: #FFFFFF;
        opacity: 0;
        animation: rise 1.1s cubic-bezier(.2,.7,.3,1) .15s forwards;
      }
      .sub {
        font-size: 23px; fill: #FFFFFF; fill-opacity: .92;
        opacity: 0;
        animation: rise 1.1s cubic-bezier(.2,.7,.3,1) .55s forwards;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(18px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .w1 { animation: drift 11s ease-in-out infinite alternate; }
      .w2 { animation: drift 15s ease-in-out infinite alternate-reverse; }
      .w3 { animation: drift 19s ease-in-out infinite alternate; }
      @keyframes drift {
        from { transform: translateX(0); }
        to   { transform: translateX(-46px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .name, .sub { opacity: 1; animation: none; }
        .w1, .w2, .w3 { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="260" fill="url(#g)"/>

  <g class="w1">
    <path d="M-140,192 C 40,158 160,214 340,196 C 520,178 640,150 820,178 C 1000,206 1140,230 1340,196 L1340,260 L-140,260 Z"
          fill="#FFFFFF" opacity="0.14"/>
  </g>
  <g class="w2">
    <path d="M-140,220 C 60,196 200,238 380,222 C 560,206 700,182 880,204 C 1060,226 1180,244 1340,222 L1340,260 L-140,260 Z"
          fill="#FFFFFF" opacity="0.10"/>
  </g>
  <g class="w3">
    <path d="M-140,240 C 80,226 220,252 400,242 C 580,232 720,214 900,230 C 1080,246 1200,252 1340,242 L1340,260 L-140,260 Z"
          fill="#FFFFFF" opacity="0.07"/>
  </g>

  <text class="name" x="600" y="126">Ziheng Xu</text>
  <text class="sub" x="600" y="176">CS @ Wuhan University of Technology</text>
</svg>
